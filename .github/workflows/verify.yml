name: verify

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format
      - name: Lint
        run: pnpm lint
      - name: Application typecheck
        run: pnpm typecheck
      - name: Script and Prisma typecheck
        run: pnpm typecheck:scripts
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Install isolated runtime dependencies
        run: pnpm --dir runtime install --prod --frozen-lockfile --ignore-workspace --config.auto-install-peers=false
      - name: Verify runtime dependency closure and Worker startup
        run: pnpm check:runtime-deps && pnpm check:runtime-worker

  rate-limit-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
      SERVICE_MODE: remote
      DATABASE_URL: postgresql://crewqual_app:crewqual-app@127.0.0.1:5432/crewqual
      DIRECT_URL: postgresql://crewqual:crewqual@127.0.0.1:5432/crewqual
      POSTGRES_APP_PASSWORD: crewqual-app
    services:
      postgres:
        image: postgres@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        env:
          POSTGRES_DB: crewqual
          POSTGRES_USER: crewqual
          POSTGRES_PASSWORD: crewqual
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crewqual -d crewqual"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Provision runtime role and apply database migrations
        run: |
          sh scripts/ensure-postgres-runtime-role.sh provision
          pnpm db:migrate
          pnpm db:migrate:queue
          sh scripts/ensure-postgres-runtime-role.sh grant
          sh scripts/ensure-postgres-runtime-role.sh verify
      - name: Run PostgreSQL rate-limit integration
        run: pnpm test:integration:rate-limit
      - name: Verify qualification state, revisions and incremental migrations on PostgreSQL
        env:
          DIRECTORY_TEST_DATABASE_URL: postgresql://crewqual:crewqual@127.0.0.1:5432/crewqual
          CREWQUAL_AUDIT_TEST_DATABASE_URL: postgresql://crewqual:crewqual@127.0.0.1:5432/crewqual
          QUALIFICATION_TEST_DIRECT_URL: postgresql://crewqual:crewqual@127.0.0.1:5432/crewqual
          QUALIFICATION_TEST_DATABASE_URL: postgresql://crewqual_app:crewqual-app@127.0.0.1:5432/crewqual
          MIGRATION_TEST_DATABASE_URL: postgresql://crewqual:crewqual@127.0.0.1:5432/crewqual
        run: pnpm exec vitest run src/server/admin-pilot-directory.pg.test.ts src/server/qualification-revision.pg.test.ts src/server/qualification-state-audit.pg.test.ts src/server/qualification-reminder-migration.pg.test.ts src/server/migrate-member-architecture.pg.test.ts
      - name: Produce read-only qualification reconciliation evidence
        run: pnpm exec tsx scripts/audit-qualification-state.ts --dry-run > qualification-state-audit.json
      - name: Retain qualification reconciliation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-state-audit
          path: qualification-state-audit.json

  browser:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            workers: 1
            dev_only: true
          - browser: firefox
            workers: 1
            dev_only: false
          - browser: webkit
            workers: 1
            dev_only: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser E2E
        env:
          PLAYWRIGHT_WORKERS: ${{ matrix.workers }}
          PLAYWRIGHT_PORT: 3100
        run: |
          if [ "${{ matrix.dev_only }}" = "true" ]; then
            pnpm test:e2e --project="${{ matrix.browser }}"
          else
            pnpm test:e2e --project="${{ matrix.browser }}" --grep-invert "@dev"
          fi
      - name: Run production standalone smoke
        env:
          PLAYWRIGHT_PRODUCTION: "1"
          PLAYWRIGHT_PORT: 3101
        run: pnpm test:e2e --project="${{ matrix.browser }}" --grep "@standalone"
      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
