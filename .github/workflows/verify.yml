name: verify

on:
  push:
    tags: ["v0.3.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format
      - name: Lint
        run: pnpm lint
      - name: Application typecheck
        run: pnpm typecheck
      - name: Script and Prisma typecheck
        run: pnpm typecheck:scripts
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build

  browser:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            workers: 2
            dev_only: true
          - browser: firefox
            workers: 1
            dev_only: false
          - browser: webkit
            workers: 1
            dev_only: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser E2E
        env:
          PLAYWRIGHT_WORKERS: ${{ matrix.workers }}
        run: |
          if [ "${{ matrix.dev_only }}" = "true" ]; then
            pnpm test:e2e --project="${{ matrix.browser }}"
          else
            pnpm test:e2e --project="${{ matrix.browser }}" --grep-invert "@dev"
          fi
      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
