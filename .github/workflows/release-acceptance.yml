name: release-acceptance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed v0.3.1-rc.N or v0.3.1 tag
        required: true
        type: string
      profile:
        description: rc or final
        required: true
        default: rc
        type: choice
        options: [rc, final]
  push:
    tags: ["v0.3.1-rc.*", "v0.3.1"]

permissions:
  contents: read
  id-token: write

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: release-sandbox
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_PROFILE: ${{ inputs.profile || (startsWith(github.ref_name, 'v0.3.1-rc.') && 'rc' || 'final') }}
      RELEASE_RUN_ID: ${{ github.run_id }}
      RELEASE_BASE_URL: ${{ secrets.RELEASE_BASE_URL }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ADMIN_TOTP_SECRET: ${{ secrets.E2E_ADMIN_TOTP_SECRET }}
      RELEASE_WEB_IMAGE: ${{ secrets.RELEASE_WEB_IMAGE }}
      RELEASE_WORKER_IMAGE: ${{ secrets.RELEASE_WORKER_IMAGE }}
      RELEASE_OPS_IMAGE: ${{ secrets.RELEASE_OPS_IMAGE }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      EVIDENCE_S3_BUCKET: ${{ secrets.EVIDENCE_S3_BUCKET }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      RESTORE_S3_BUCKET: ${{ secrets.RESTORE_S3_BUCKET }}
      S3_KMS_KEY_ARN: ${{ secrets.S3_KMS_KEY_ARN }}
      S3_FORBIDDEN_PREFIX: ${{ secrets.S3_FORBIDDEN_PREFIX }}
      BACKUP_RECOVERY_SET_ID: ${{ secrets.BACKUP_RECOVERY_SET_ID }}
      BACKUP_DATABASE_RUN_ID: ${{ secrets.BACKUP_DATABASE_RUN_ID }}
      BACKUP_GALLERY_RUN_ID: ${{ secrets.BACKUP_GALLERY_RUN_ID }}
      BACKUP_TAMPER_ARTIFACT_KEYS: ${{ secrets.BACKUP_TAMPER_ARTIFACT_KEYS }}
      BACKUP_TAMPER_BLOB_SHA256: ${{ secrets.BACKUP_TAMPER_BLOB_SHA256 }}
      RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RELEASE_SIGNER_FINGERPRINTS: ${{ secrets.RELEASE_SIGNER_FINGERPRINTS }}
      COSIGN_CERT_IDENTITY_REGEXP: ${{ secrets.COSIGN_CERT_IDENTITY_REGEXP }}
      COSIGN_OIDC_ISSUER: ${{ secrets.COSIGN_OIDC_ISSUER }}
      LICENSE_APPROVALS_FILE: /tmp/license-approvals.json
      RELEASE_EVIDENCE_SIGNATURE: /tmp/evidence.sig
      SMS_ADAPTER: disabled
      FEISHU_ADAPTER: disabled
      VLM_ADAPTER: disabled
    steps:
      - name: Checkout signed release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12.0
          cache: pnpm
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Install browser engines
        run: corepack pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Install release verification tools
        run: sudo ./scripts/release/install-tools.sh
      - name: Prepare signed evidence inputs
        env:
          LICENSE_APPROVALS_JSON: ${{ secrets.LICENSE_APPROVALS_JSON }}
          RELEASE_EVIDENCE_SIGNATURE_B64: ${{ secrets.RELEASE_EVIDENCE_SIGNATURE_B64 }}
        run: |
          printf '%s' "$LICENSE_APPROVALS_JSON" > "$LICENSE_APPROVALS_FILE"
          printf '%s' "$RELEASE_EVIDENCE_SIGNATURE_B64" | base64 --decode > "$RELEASE_EVIDENCE_SIGNATURE"
          corepack pnpm release:manifest .artifacts/migration-checksums.json
          echo "MIGRATION_CHECKSUM_MANIFEST=$GITHUB_WORKSPACE/.artifacts/migration-checksums.json" >> "$GITHUB_ENV"
      - name: Run release acceptance gates
        env:
          RELEASE_DEFER_ARTIFACT: "1"
        run: corepack pnpm release:verify -- --tag "$RELEASE_TAG" --profile "$RELEASE_PROFILE"
      - name: Sign release evidence
        if: env.RELEASE_PROFILE == 'final'
        run: |
          cosign sign-blob --yes \
            --output-signature "$RELEASE_EVIDENCE_SIGNATURE" \
            --output-certificate /tmp/evidence.pem \
            ".artifacts/release/$RELEASE_RUN_ID/evidence.json"
      - name: Verify signed release evidence
        if: env.RELEASE_PROFILE == 'final'
        run: corepack pnpm release:verify:artifact -- --tag "$RELEASE_TAG" --profile "$RELEASE_PROFILE"
