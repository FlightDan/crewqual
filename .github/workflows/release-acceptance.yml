name: release-acceptance
run-name: CrewQual release ${{ inputs.tag }} (${{ inputs.profile }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed release tag (for example v1.0.1-rc.1 or v1.0.1)
        required: true
        type: string
      profile:
        description: rc or final
        required: true
        default: rc
        type: choice
        options: [rc, final]
      arm64_bootstrap_from_tag:
        description: Optional same-version positive RC for final arm64 bootstrap; requires stable upgrade baseline
        required: false
        default: ""
        type: string
      acceptance_scope:
        description: local runs static/bootstrap gates; isolated runs temporary DR and candidate-image E2E; full uses external S3 DR
        required: true
        default: local
        type: choice
        options: [local, isolated, full]
      upgrade_from_tag:
        description: Existing lower release for upgrade/rollback; leave blank for the first deployable release
        required: false
        default: ""
        type: string
      replace_existing_assets:
        description: Allow replacing existing assets when the same release tag is intentionally covered
        required: true
        default: false
        type: boolean
permissions:
  contents: read

concurrency:
  group: crewqual-release-acceptance-sandbox
  cancel-in-progress: false

env:
  # Non-secret run parameters only. Secrets are scoped to individual
  # validation, signing, and acceptance steps; setup/install steps receive none.
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_PROFILE: ${{ inputs.profile }}
  RELEASE_ACCEPTANCE_SCOPE: ${{ inputs.acceptance_scope }}
  RELEASE_UPGRADE_FROM_TAG: ${{ inputs.upgrade_from_tag }}
  RELEASE_REPLACE_EXISTING_ASSETS: ${{ inputs.replace_existing_assets }}
  RELEASE_ARM64_BOOTSTRAP_FROM_TAG: ${{ inputs.arm64_bootstrap_from_tag }}
  RELEASE_RUN_ID: ${{ github.run_id }}
  LICENSE_APPROVALS_FILE: /tmp/license-approvals.json
  SMS_ADAPTER: disabled
  FEISHU_ADAPTER: disabled
  VLM_ADAPTER: disabled

jobs:
  validate-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      target: ${{ steps.inputs.outputs.target }}
      baseline: ${{ steps.inputs.outputs.baseline }}
      mode: ${{ steps.inputs.outputs.mode }}
    steps:
      # This intentionally runs without checkout, dependency installation,
      # environment access, credentials, or OIDC permissions.
      - name: Validate release tag, profile, and upgrade baseline
        id: inputs
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os, re
          def fail(message):
              raise SystemExit(message)
          def version(tag):
              match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-rc\.(0|[1-9][0-9]*))?", tag)
              if not match:
                  fail("release tags must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N")
              major, minor, patch, rc = match.groups()
              number = lambda value: (len(value), value)
              return (number(major), number(minor), number(patch), rc is None, number(rc or "0"))
          tag = os.environ["RELEASE_TAG"]
          profile = os.environ["RELEASE_PROFILE"]
          scope = os.environ["RELEASE_ACCEPTANCE_SCOPE"]
          baseline = os.environ["RELEASE_UPGRADE_FROM_TAG"]
          alternate = os.environ.get("RELEASE_ARM64_BOOTSTRAP_FROM_TAG", "")
          target = version(tag)
          if profile not in ("rc", "final") or (profile == "final") != target[3]:
              fail("release profile does not match tag channel")
          if scope not in ("local", "isolated", "full"):
              fail("invalid acceptance scope")
          if profile == "final" and scope not in ("isolated", "full"):
              fail("final releases require isolated or full acceptance")
          if baseline:
              previous = version(baseline)
              if previous[3] != target[3] or previous >= target:
                  fail("upgrade baseline must be a strictly lower release in the same channel")
          if alternate:
              candidate = version(alternate)
              if profile != "final" or not baseline or candidate[3] or candidate[:3] != target[:3] or candidate[4] == (1, "0"):
                  fail("arm64 bootstrap must be a positive RC of the final target with a stable baseline")
          mode = "upgrade" if baseline else "fresh"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"target={tag}\nbaseline={baseline}\nmode={mode}\n")
          print("release inputs valid: " + mode)
          PYTHON

  acceptance-config:
    needs: validate-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    environment: release-sandbox
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      tag_object: ${{ steps.tag.outputs.tag_object }}
      baseline_commit: ${{ steps.tag.outputs.baseline_commit }}
      baseline_tag_object: ${{ steps.tag.outputs.baseline_tag_object }}
      arm64_baseline_commit: ${{ steps.tag.outputs.arm64_baseline_commit }}
      arm64_baseline_tag_object: ${{ steps.tag.outputs.arm64_baseline_tag_object }}
    steps:
      - name: Checkout requested release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Verify annotated tag and signer allowlist
        id: tag
        env:
          RELEASE_TAG_SIGNING_PUBLIC_KEY_B64: ${{ secrets.RELEASE_TAG_SIGNING_PUBLIC_KEY_B64 }}
          RELEASE_SIGNER_FINGERPRINTS: ${{ secrets.RELEASE_SIGNER_FINGERPRINTS }}
          GNUPGHOME: ${{ runner.temp }}/release-gnupg
        run: |
          set -euo pipefail
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$RELEASE_TAG_SIGNING_PUBLIC_KEY_B64" | base64 --decode > "$RUNNER_TEMP/tag-signing-key.asc"
          gpg --batch --homedir "$GNUPGHOME" --import "$RUNNER_TEMP/tag-signing-key.asc"
          verify_signed_tag() {
            local tag="$1" raw signing_fpr primary_fpr allowed=0 allowed_fpr
            [[ "$(git cat-file -t "$tag")" == tag ]] || { echo "release tag must be annotated: $tag"; return 1; }
            raw="$(git verify-tag --raw "$tag" 2>&1)"
            printf '%s\n' "$raw" | grep -q '\[GNUPG:\] VALIDSIG '
            signing_fpr="$(printf '%s\n' "$raw" | awk '$2=="VALIDSIG" {print $3; exit}')"
            primary_fpr="$(printf '%s\n' "$raw" | awk '$2=="VALIDSIG" {print $NF; exit}')"
            [[ -n "$signing_fpr" && -n "$primary_fpr" ]]
            IFS=',' read -r -a fingerprints <<< "$RELEASE_SIGNER_FINGERPRINTS"
            for allowed_fpr in "${fingerprints[@]}"; do
              allowed_fpr="${allowed_fpr//[[:space:]]/}"
              [[ -n "$allowed_fpr" ]] || continue
              [[ "${allowed_fpr,,}" == "${signing_fpr,,}" || "${allowed_fpr,,}" == "${primary_fpr,,}" ]] && allowed=1
            done
            ((allowed == 1)) || { echo "tag signing primary/subkey is not allowlisted: $tag"; return 1; }
            VERIFIED_COMMIT="$(git rev-parse "$tag^{commit}")"
            VERIFIED_TAG_OBJECT="$(git rev-parse "$tag")"
            [[ "$VERIFIED_COMMIT" =~ ^[0-9a-f]{40}$ && "$VERIFIED_TAG_OBJECT" =~ ^[0-9a-f]{40}$ ]]
          }
          verify_signed_tag "$RELEASE_TAG"
          commit="$VERIFIED_COMMIT"
          tag_object="$VERIFIED_TAG_OBJECT"
          [[ "$commit" =~ ^[0-9a-f]{40}$ && "$tag_object" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$commit" ]] || { echo 'checked-out commit does not match signed tag'; exit 1; }
          baseline_commit=""
          baseline_tag_object=""
          if [[ -n "$RELEASE_UPGRADE_FROM_TAG" ]]; then
            verify_signed_tag "$RELEASE_UPGRADE_FROM_TAG"
            baseline_commit="$VERIFIED_COMMIT"
            baseline_tag_object="$VERIFIED_TAG_OBJECT"
          fi
          arm64_baseline_commit=""
          arm64_baseline_tag_object=""
          if [[ -n "$RELEASE_ARM64_BOOTSTRAP_FROM_TAG" ]]; then
            verify_signed_tag "$RELEASE_ARM64_BOOTSTRAP_FROM_TAG"
            [[ "$VERIFIED_COMMIT" == "$commit" ]] || { echo 'arm64 promotion RC must name the final target commit'; exit 1; }
            arm64_baseline_commit="$VERIFIED_COMMIT"
            arm64_baseline_tag_object="$VERIFIED_TAG_OBJECT"
          fi
          printf 'arm64_baseline_commit=%s\narm64_baseline_tag_object=%s\n' "$arm64_baseline_commit" "$arm64_baseline_tag_object" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\ntag_object=%s\nbaseline_commit=%s\nbaseline_tag_object=%s\n' \
            "$commit" "$tag_object" "$baseline_commit" "$baseline_tag_object" >> "$GITHUB_OUTPUT"
      - name: Confirm checked-out input validator agrees with the early gate
        env:
          VALIDATED_MODE: ${{ needs.validate-inputs.outputs.mode }}
        run: |
          set -euo pipefail
          mode="$(bash scripts/release/validate-release-inputs.sh "$RELEASE_TAG" "$RELEASE_PROFILE" "$RELEASE_ACCEPTANCE_SCOPE" "$RELEASE_UPGRADE_FROM_TAG" "$RELEASE_ARM64_BOOTSTRAP_FROM_TAG")"
          [[ "$mode" == "$VALIDATED_MODE" ]] || { echo 'release input validators disagree'; exit 1; }
      - name: Preflight signed upgrade baseline release
        if: inputs.upgrade_from_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_BASELINE_TAG_OBJECT: ${{ steps.tag.outputs.baseline_tag_object }}
        run: |
          set -euo pipefail
          remote_tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_UPGRADE_FROM_TAG" --jq .object.sha)"
          [[ "$remote_tag_object" == "$VALIDATED_BASELINE_TAG_OBJECT" ]] || {
            echo 'upgrade baseline tag differs from the validated signed object'
            exit 1
          }
          release="$(gh release view "$RELEASE_UPGRADE_FROM_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets,isDraft,isPrerelease,tagName)"
          expected_prerelease=false
          [[ "$RELEASE_UPGRADE_FROM_TAG" == *-rc.* ]] && expected_prerelease=true
          jq -e --arg tag "$RELEASE_UPGRADE_FROM_TAG" --argjson prerelease "$expected_prerelease" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == $prerelease' <<< "$release" >/dev/null
          required_assets=(
            update-manifest-v1.json update-manifest-v1.json.sig SHA256SUMS SHA256SUMS.sig
            crewqual-updater-linux-amd64 crewqual-updater-linux-arm64
            docker-compose.install.yml Caddyfile configure-domain.sh
            evidence.json evidence.json.sig evidence.bundle.json
          )
          for asset in "${required_assets[@]}"; do
            jq -e --arg name "$asset" \
              '[.assets[] | select(.name == $name and .size > 0)] | length == 1' \
              <<< "$release" >/dev/null || {
                echo "upgrade baseline is missing a non-empty signed release asset: $asset"
                exit 1
              }
          done
      - name: Preflight signed arm64 bootstrap release
        if: inputs.arm64_bootstrap_from_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_BASELINE_TAG_OBJECT: ${{ steps.tag.outputs.arm64_baseline_tag_object }}
        run: |
          set -euo pipefail
          remote_tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_ARM64_BOOTSTRAP_FROM_TAG" --jq .object.sha)"
          [[ "$remote_tag_object" == "$VALIDATED_BASELINE_TAG_OBJECT" ]] || {
            echo 'upgrade baseline tag differs from the validated signed object'
            exit 1
          }
          release="$(gh release view "$RELEASE_ARM64_BOOTSTRAP_FROM_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets,isDraft,isPrerelease,tagName)"
          expected_prerelease=false
          [[ "$RELEASE_ARM64_BOOTSTRAP_FROM_TAG" == *-rc.* ]] && expected_prerelease=true
          jq -e --arg tag "$RELEASE_ARM64_BOOTSTRAP_FROM_TAG" --argjson prerelease "$expected_prerelease" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == $prerelease' <<< "$release" >/dev/null
          required_assets=(
            update-manifest-v1.json update-manifest-v1.json.sig SHA256SUMS SHA256SUMS.sig
            crewqual-updater-linux-amd64 crewqual-updater-linux-arm64
            docker-compose.install.yml Caddyfile configure-domain.sh
            evidence.json evidence.json.sig evidence.bundle.json
          )
          for asset in "${required_assets[@]}"; do
            jq -e --arg name "$asset" \
              '[.assets[] | select(.name == $name and .size > 0)] | length == 1' \
              <<< "$release" >/dev/null || {
                echo "upgrade baseline is missing a non-empty signed release asset: $asset"
                exit 1
              }
          done
      - name: Verify signed baseline manifests and native image platforms
        if: inputs.upgrade_from_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_baseline_platform() {
            local tag="$1" arch="$2" directory image actual
            directory="$(mktemp -d)"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$directory" \
              --pattern update-manifest-v1.json --pattern update-manifest-v1.json.sig \
              --pattern SHA256SUMS --pattern SHA256SUMS.sig
            node - "$directory" "$tag" <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const [directory, tag] = process.argv.slice(2);
          const read = name => fs.readFileSync(`${directory}/${name}`);
          const manifest = JSON.parse(read('update-manifest-v1.json'));
          const keyring = JSON.parse(fs.readFileSync('security/update-manifest-keyring.json'));
          const keys = keyring.keys.filter(key => key.id === manifest.signingKeyId && ['active', 'next'].includes(key.status));
          if (keys.length !== 1) throw new Error('baseline manifest key is not trusted');
          const key = crypto.createPublicKey({key: Buffer.concat([Buffer.from('302a300506032b6570032100', 'hex'), Buffer.from(keys[0].publicKey, 'base64')]), format: 'der', type: 'spki'});
          for (const name of ['update-manifest-v1.json', 'SHA256SUMS']) {
            if (!crypto.verify(null, read(name), key, Buffer.from(read(`${name}.sig`).toString().trim(), 'base64'))) throw new Error(`invalid baseline signature: ${name}`);
          }
          if (manifest.version !== tag || manifest.channel !== (tag.includes('-rc.') ? 'rc' : 'stable')) throw new Error('baseline manifest version/channel mismatch');
          const entries = read('SHA256SUMS').toString().split('\n').filter(line => /^[a-f0-9]{64}  update-manifest-v1\.json$/.test(line));
          if (entries.length !== 1 || entries[0].slice(0, 64) !== crypto.createHash('sha256').update(read('update-manifest-v1.json')).digest('hex')) throw new Error('baseline manifest checksum mismatch');
          for (const [field, suffix] of [['webImage', 'web'], ['runtimeImage', 'runtime']]) {
            if (!new RegExp(`^ghcr\\.io/flightdan/crewqual-${suffix}@sha256:[a-f0-9]{64}$`).test(manifest[field])) throw new Error('baseline image reference must be an official digest');
          }
          NODE
            while IFS= read -r image; do
              docker pull --platform "linux/$arch" "$image" >/dev/null
              actual="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")"
              # Docker binds a digest pull to the selected platform locally and
              # refuses to overwrite that reference during the next architecture
              # probe. This runner is disposable, so remove only the exact
              # baseline reference after recording its native platform.
              docker image rm --force "$image" >/dev/null
              [[ "$actual" == "linux/$arch" ]] || { echo "baseline $tag image lacks linux/$arch"; return 1; }
            done < <(jq -r '.webImage, .runtimeImage' "$directory/update-manifest-v1.json")
            rm -rf -- "$directory"
          }
          verify_baseline_platform "$RELEASE_UPGRADE_FROM_TAG" amd64
          verify_baseline_platform "${RELEASE_ARM64_BOOTSTRAP_FROM_TAG:-$RELEASE_UPGRADE_FROM_TAG}" arm64
      - name: Setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate local or isolated release acceptance configuration
        if: inputs.acceptance_scope == 'local' || inputs.acceptance_scope == 'isolated'
        env:
          UPDATE_MANIFEST_PRIVATE_KEY_B64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_B64 }}
          UPDATE_MANIFEST_SIGNING_KEY_ID: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY_ID }}
          RELEASE_TAG_SIGNING_PUBLIC_KEY_B64: ${{ secrets.RELEASE_TAG_SIGNING_PUBLIC_KEY_B64 }}
          RELEASE_SIGNER_FINGERPRINTS: ${{ secrets.RELEASE_SIGNER_FINGERPRINTS }}
          LICENSE_APPROVALS_JSON: ${{ secrets.LICENSE_APPROVALS_JSON }}
        run: pnpm release:validate-config
      - name: Validate full release acceptance configuration
        if: inputs.acceptance_scope == 'full'
        env:
          UPDATE_MANIFEST_PRIVATE_KEY_B64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_B64 }}
          UPDATE_MANIFEST_SIGNING_KEY_ID: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY_ID }}
          RELEASE_TAG_SIGNING_PUBLIC_KEY_B64: ${{ secrets.RELEASE_TAG_SIGNING_PUBLIC_KEY_B64 }}
          RELEASE_SIGNER_FINGERPRINTS: ${{ secrets.RELEASE_SIGNER_FINGERPRINTS }}
          LICENSE_APPROVALS_JSON: ${{ secrets.LICENSE_APPROVALS_JSON }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          EVIDENCE_S3_BUCKET: ${{ secrets.EVIDENCE_S3_BUCKET }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          RESTORE_S3_BUCKET: ${{ secrets.RESTORE_S3_BUCKET }}
          S3_KMS_KEY_ARN: ${{ secrets.S3_KMS_KEY_ARN }}
          S3_FORBIDDEN_PREFIX: ${{ secrets.S3_FORBIDDEN_PREFIX }}
          BACKUP_RECOVERY_SET_ID: ${{ secrets.BACKUP_RECOVERY_SET_ID }}
          BACKUP_DATABASE_RUN_ID: ${{ secrets.BACKUP_DATABASE_RUN_ID }}
          BACKUP_GALLERY_RUN_ID: ${{ secrets.BACKUP_GALLERY_RUN_ID }}
          BACKUP_TAMPER_ARTIFACT_KEYS: ${{ secrets.BACKUP_TAMPER_ARTIFACT_KEYS }}
          BACKUP_TAMPER_BLOB_SHA256: ${{ secrets.BACKUP_TAMPER_BLOB_SHA256 }}
          RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm release:validate-config

  build-platform-images:
    needs: acceptance-config
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ needs.acceptance-config.outputs.commit }}
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build native platform manifests
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$(uname -m):$RELEASE_ARCH" in
            x86_64:amd64|aarch64:arm64) ;;
            *) echo 'native build runner architecture mismatch'; exit 1 ;;
          esac
          docker buildx create --use --driver docker-container
          mkdir -p "$RUNNER_TEMP/image-digests"
          for component in web runtime; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-$component"
            tag="$RELEASE_TAG-$RELEASE_ARCH-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            docker buildx build --pull --platform "linux/$RELEASE_ARCH" \
              --target "$component-runner" \
              --build-arg VCS_REF="$(git rev-parse HEAD)" \
              --build-arg VERSION="$RELEASE_TAG" \
              --build-arg SOURCE_URL="https://github.com/$GITHUB_REPOSITORY" \
              --provenance=false --sbom=false \
              --output "type=image,name=$image:$tag,push=true,oci-mediatypes=true" \
              --metadata-file "$RUNNER_TEMP/build-metadata.json" .
            digest="$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/build-metadata.json")"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            if [[ "$component" == runtime ]]; then
              docker run --rm --network none --platform "linux/$RELEASE_ARCH" \
                --env NODE_ENV=development --env SERVICE_MODE=mock \
                --env NEXT_PUBLIC_SERVICE_MODE=mock "$image@$digest" |
                grep -q '"event":"worker_disabled"'
            fi
            jq -n --arg image "$image@$digest" --arg arch "$RELEASE_ARCH" \
              --arg commit "$(git rev-parse HEAD)" \
              '{image:$image,arch:$arch,commit:$commit}' \
              > "$RUNNER_TEMP/image-digests/$component-$RELEASE_ARCH.json"
          done
      - name: Upload platform digest records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-digests
          if-no-files-found: error

  build-images:
    needs: [acceptance-config, build-platform-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      web_image: ${{ steps.images.outputs.web_image }}
      runtime_image: ${{ steps.images.outputs.runtime_image }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ needs.acceptance-config.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/image-digests
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Install image signing and SBOM tools
        run: sudo ./scripts/release/install-tools.sh
      - name: Assemble, sign, and verify OCI indexes and platform evidence
        id: images
        run: ./scripts/release/assemble-image-indexes.sh "$RUNNER_TEMP/image-digests"

  acceptance:
    needs: [acceptance-config, build-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
      id-token: write
    environment: release-sandbox
    env:
      RELEASE_WEB_IMAGE: ${{ needs.build-images.outputs.web_image }}
      RELEASE_RUNTIME_IMAGE: ${{ needs.build-images.outputs.runtime_image }}
      COSIGN_CERT_IDENTITY_REGEXP: ^https://github\.com/FlightDan/crewqual/\.github/workflows/release-acceptance\.yml@.*$
      COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Checkout signed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.acceptance-config.outputs.commit }}
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Verify annotated tag and signer allowlist
        env:
          RELEASE_TAG_SIGNING_PUBLIC_KEY_B64: ${{ secrets.RELEASE_TAG_SIGNING_PUBLIC_KEY_B64 }}
          RELEASE_SIGNER_FINGERPRINTS: ${{ secrets.RELEASE_SIGNER_FINGERPRINTS }}
          VALIDATED_COMMIT: ${{ needs.acceptance-config.outputs.commit }}
          VALIDATED_TAG_OBJECT: ${{ needs.acceptance-config.outputs.tag_object }}
          GNUPGHOME: ${{ runner.temp }}/release-gnupg
        run: |
          set -euo pipefail
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$RELEASE_TAG_SIGNING_PUBLIC_KEY_B64" | base64 --decode > "$RUNNER_TEMP/tag-signing-key.asc"
          gpg --batch --homedir "$GNUPGHOME" --import "$RUNNER_TEMP/tag-signing-key.asc"
          ! git cat-file -t "$RELEASE_TAG" | grep -qx tag && { echo 'release tag must be annotated'; exit 1; }
          raw="$(git verify-tag --raw "$RELEASE_TAG" 2>&1)"
          printf '%s\n' "$raw" | grep -q '\[GNUPG:\] VALIDSIG '
          signing_fpr="$(printf '%s\n' "$raw" | awk '$2=="VALIDSIG" {print $3; exit}')"
          primary_fpr="$(printf '%s\n' "$raw" | awk '$2=="VALIDSIG" {print $NF; exit}')"
          [[ -n "$signing_fpr" && -n "$primary_fpr" ]]
          allowed=0
          IFS=',' read -r -a fingerprints <<< "$RELEASE_SIGNER_FINGERPRINTS"
          for allowed_fpr in "${fingerprints[@]}"; do
            allowed_fpr="${allowed_fpr//[[:space:]]/}"
            [[ "${allowed_fpr,,}" == "${signing_fpr,,}" || "${allowed_fpr,,}" == "${primary_fpr,,}" ]] && allowed=1
          done
          ((allowed == 1)) || { echo 'tag signing primary/subkey is not allowlisted'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$VALIDATED_COMMIT" ]]
          [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" == "$VALIDATED_COMMIT" ]]
          [[ "$(git rev-parse "$RELEASE_TAG")" == "$VALIDATED_TAG_OBJECT" ]]
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Install release verification tools
        run: sudo ./scripts/release/install-tools.sh
      - name: Verify keyring and build signed release assets
        env:
          UPDATE_MANIFEST_PRIVATE_KEY_B64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_B64 }}
          UPDATE_MANIFEST_SIGNING_KEY_ID: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY_ID }}
        id: release-assets
        run: |
          set -euo pipefail
          export RELEASE_PUBLISHED_AT="$(git log -1 --format=%cI "$RELEASE_TAG")"
          RELEASE_REQUIRE_ACTIVE_KEY=1 pnpm release:check-keyring
          updater_dir="$RUNNER_TEMP/crewqual-updater"
          asset_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$asset_dir"
          ./updater/build-release.sh "$updater_dir"
          cp "$updater_dir/crewqual-updater-linux-amd64" "$asset_dir/"
          cp "$updater_dir/crewqual-updater-linux-arm64" "$asset_dir/"
          export UPDATER_AMD64_SHA256="$(awk '{print $1}' "$updater_dir/crewqual-updater-linux-amd64.sha256")"
          export UPDATER_ARM64_SHA256="$(awk '{print $1}' "$updater_dir/crewqual-updater-linux-arm64.sha256")"
          export UPDATE_MANIFEST_OUTPUT="$asset_dir/update-manifest-v1.json"
          pnpm release:update-manifest
          pnpm release:sign-update-manifest "$UPDATE_MANIFEST_OUTPUT" "$asset_dir/update-manifest-v1.json.sig"
          "$asset_dir/crewqual-updater-linux-amd64" verify-manifest --manifest "$asset_dir/update-manifest-v1.json" --signature "$asset_dir/update-manifest-v1.json.sig" --tag "$RELEASE_TAG" >/dev/null
          cp "$asset_dir/update-manifest-v1.json" "$RUNNER_TEMP/manifest-tampered.json"
          printf ' ' >> "$RUNNER_TEMP/manifest-tampered.json"
          if "$asset_dir/crewqual-updater-linux-amd64" verify-manifest --manifest "$RUNNER_TEMP/manifest-tampered.json" --signature "$asset_dir/update-manifest-v1.json.sig" --tag "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'tampered manifest unexpectedly verified'; exit 1
          fi
          cp docker-compose.install.yml Caddyfile scripts/configure-domain.sh "$asset_dir/"
          echo "asset_dir=$asset_dir" >> "$GITHUB_OUTPUT"
      - name: Prepare evidence inputs
        env:
          LICENSE_APPROVALS_JSON: ${{ secrets.LICENSE_APPROVALS_JSON }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_PROFILE" == final || "$RELEASE_ACCEPTANCE_SCOPE" == full ]]; then
            printf '%s' "$LICENSE_APPROVALS_JSON" > "$LICENSE_APPROVALS_FILE"
          else
            if [[ -n "$LICENSE_APPROVALS_JSON" ]]; then
              printf '%s' "$LICENSE_APPROVALS_JSON" > "$LICENSE_APPROVALS_FILE"
            else
              printf '%s\n' '{"licenses":[]}' > "$LICENSE_APPROVALS_FILE"
            fi
          fi
          pnpm release:manifest .artifacts/migration-checksums.json
          echo "MIGRATION_CHECKSUM_MANIFEST=$GITHUB_WORKSPACE/.artifacts/migration-checksums.json" >> "$GITHUB_ENV"
      - name: Run local release acceptance gates
        if: inputs.acceptance_scope == 'local'
        env:
          UPDATE_MANIFEST_PRIVATE_KEY_B64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_B64 }}
          UPDATE_MANIFEST_SIGNING_KEY_ID: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY_ID }}
          RELEASE_TAG_SIGNING_PUBLIC_KEY_B64: ${{ secrets.RELEASE_TAG_SIGNING_PUBLIC_KEY_B64 }}
          RELEASE_SIGNER_FINGERPRINTS: ${{ secrets.RELEASE_SIGNER_FINGERPRINTS }}
          LICENSE_APPROVALS_JSON: ${{ secrets.LICENSE_APPROVALS_JSON }}
          RELEASE_DEFER_ARTIFACT: "1"
        run: node --import tsx scripts/release/verify.ts local --tag "$RELEASE_TAG" --profile "$RELEASE_PROFILE"
      - name: Run isolated release acceptance gates
        if: inputs.acceptance_scope == 'isolated'
        env:
          UPDATE_MANIFEST_PRIVATE_KEY_B64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_B64 }}
          UPDATE_MANIFEST_SIGNING_KEY_ID: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY_ID }}
          RELEASE_TAG_SIGNING_PUBLIC_KEY_B64: ${{ secrets.RELEASE_TAG_SIGNING_PUBLIC_KEY_B64 }}
          RELEASE_SIGNER_FINGERPRINTS: ${{ secrets.RELEASE_SIGNER_FINGERPRINTS }}
          LICENSE_APPROVALS_JSON: ${{ secrets.LICENSE_APPROVALS_JSON }}
          RELEASE_DEFER_ARTIFACT: "1"
        run: pnpm release:verify -- --tag "$RELEASE_TAG" --profile "$RELEASE_PROFILE"
      - name: Run full release acceptance gates
        if: inputs.acceptance_scope == 'full'
        env:
          UPDATE_MANIFEST_PRIVATE_KEY_B64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_B64 }}
          UPDATE_MANIFEST_SIGNING_KEY_ID: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY_ID }}
          RELEASE_TAG_SIGNING_PUBLIC_KEY_B64: ${{ secrets.RELEASE_TAG_SIGNING_PUBLIC_KEY_B64 }}
          RELEASE_SIGNER_FINGERPRINTS: ${{ secrets.RELEASE_SIGNER_FINGERPRINTS }}
          LICENSE_APPROVALS_JSON: ${{ secrets.LICENSE_APPROVALS_JSON }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          EVIDENCE_S3_BUCKET: ${{ secrets.EVIDENCE_S3_BUCKET }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          RESTORE_S3_BUCKET: ${{ secrets.RESTORE_S3_BUCKET }}
          S3_KMS_KEY_ARN: ${{ secrets.S3_KMS_KEY_ARN }}
          S3_FORBIDDEN_PREFIX: ${{ secrets.S3_FORBIDDEN_PREFIX }}
          BACKUP_RECOVERY_SET_ID: ${{ secrets.BACKUP_RECOVERY_SET_ID }}
          BACKUP_DATABASE_RUN_ID: ${{ secrets.BACKUP_DATABASE_RUN_ID }}
          BACKUP_GALLERY_RUN_ID: ${{ secrets.BACKUP_GALLERY_RUN_ID }}
          BACKUP_TAMPER_ARTIFACT_KEYS: ${{ secrets.BACKUP_TAMPER_ARTIFACT_KEYS }}
          BACKUP_TAMPER_BLOB_SHA256: ${{ secrets.BACKUP_TAMPER_BLOB_SHA256 }}
          RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RELEASE_DEFER_ARTIFACT: "1"
        run: pnpm release:verify -- --tag "$RELEASE_TAG" --profile "$RELEASE_PROFILE"
      - name: Assemble evidence and sign every release asset
        env:
          UPDATE_MANIFEST_PRIVATE_KEY_B64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_B64 }}
          UPDATE_MANIFEST_SIGNING_KEY_ID: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          evidence_dir=".artifacts/release/$RELEASE_RUN_ID"
          asset_dir="${{ steps.release-assets.outputs.asset_dir }}"
          cp "$evidence_dir/evidence.json" "$asset_dir/evidence.json"
          (
            cd "$asset_dir"
            find . -maxdepth 1 -type f ! -name 'evidence*' ! -name SHA256SUMS ! -name SHA256SUMS.sig -printf '%f\n' |
              sort |
              while read -r file; do sha256sum "$file"; done
          ) > "$asset_dir/SHA256SUMS"
          export SIGN_FILE_INPUT="$asset_dir/SHA256SUMS"
          export SIGN_FILE_OUTPUT="$asset_dir/SHA256SUMS.sig"
          pnpm release:sign-file
          RELEASE_ASSET_DIR="$asset_dir" RELEASE_EVIDENCE_PATH="$evidence_dir/evidence.json" pnpm release:assemble-assets
          cp "$asset_dir/evidence.json" "$evidence_dir/evidence.json"
          export SIGN_FILE_INPUT="$asset_dir/evidence.json"
          export SIGN_FILE_OUTPUT="$asset_dir/evidence.json.sig"
          pnpm release:sign-file
          # COSIGN_OIDC_ISSUER is needed by verification, but Cosign v3
          # treats it as an explicit service URL and rejects it while using
          # the TUF signing config for keyless signing. Keep it out of the
          # signing process and restore it for the verification command.
          env -u COSIGN_OIDC_ISSUER cosign sign-blob --yes --bundle "$asset_dir/evidence.bundle.json" "$asset_dir/evidence.json"
          cp "$asset_dir/evidence.json" "$evidence_dir/evidence.json"
          RELEASE_EVIDENCE_BUNDLE="$asset_dir/evidence.bundle.json" pnpm release:verify:artifact -- --tag "$RELEASE_TAG" --profile "$RELEASE_PROFILE"
      - name: Upload complete release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ inputs.tag }}
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error

  publish:
    needs: [acceptance-config, acceptance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ inputs.tag }}
          path: release-assets
      - name: Create or validate prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_TAG_OBJECT: ${{ needs.acceptance-config.outputs.tag_object }}
        run: |
          set -euo pipefail
          remote_tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
          [[ "$remote_tag_object" == "$VALIDATED_TAG_OBJECT" ]] || { echo 'release tag moved after validation'; exit 1; }
          release_lookup_error="$RUNNER_TEMP/release-lookup.err"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --silent 2>"$release_lookup_error"; then
            : # An existing release is handled by the hash-preserving upload step.
          elif grep -Fq '(HTTP 404)' "$release_lookup_error"; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "CrewQual $RELEASE_TAG" --notes "Signed release assets" --prerelease --latest=false
          else
            cat "$release_lookup_error" >&2
            echo 'unable to prove the GitHub Release is absent' >&2
            exit 1
          fi
      - name: Upload assets without clobber and verify remote hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_hash() {
            local asset_api_url="$1" remote_url="$2" digest="" actual=""
            digest="$(gh api "$asset_api_url" --jq '.digest // empty' 2>/dev/null || true)"
            if [[ "$digest" =~ ^sha256:[a-fA-F0-9]{64}$ ]]; then
              printf '%s\n' "${digest#sha256:}"
              return 0
            fi
            for _ in $(seq 1 30); do
              if actual="$(curl -fsSL --retry 3 "$remote_url" | sha256sum | awk '{print $1}')"; then
                printf '%s\n' "$actual"
                return 0
              fi
              sleep 2
            done
            echo "asset hash unavailable: $remote_url" >&2
            return 1
          }
          for file in release-assets/*; do
            name="$(basename "$file")"
            # Use the Release asset's canonical URL. browserDownloadUrl is
            # intermittently omitted by gh when the Release has just been
            # updated, which would make an existing asset look absent and
            # cause a non-clobbering upload to fail with a name collision.
            remote_api="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$name\") | .apiUrl" | head -n 1)"
            remote="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$name\") | .url" | head -n 1)"
            if [[ -n "$remote" ]]; then
              local_hash="$(sha256sum "$file" | awk '{print $1}')"
              remote_hash="$(asset_hash "$remote_api" "$remote")"
              if [[ "$remote_hash" != "$local_hash" ]]; then
                [[ "$RELEASE_REPLACE_EXISTING_ASSETS" == true ]] || {
                  echo "asset collision with different bytes: $name"
                  exit 1
                }
                gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "$file"
                remote_api="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$name\") | .apiUrl" | head -n 1)"
                remote="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$name\") | .url" | head -n 1)"
                remote_hash="$(asset_hash "$remote_api" "$remote")"
              fi
              [[ "$remote_hash" == "$local_hash" ]] || { echo "asset verification failed after upload: $name"; exit 1; }
            else
              gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$file"
              remote_api="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$name\") | .apiUrl" | head -n 1)"
              remote="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$name\") | .url" | head -n 1)"
              local_hash="$(sha256sum "$file" | awk '{print $1}')"
              remote_hash="$(asset_hash "$remote_api" "$remote")"
              [[ "$remote_hash" == "$local_hash" ]] || { echo "asset verification failed after upload: $name"; exit 1; }
            fi
          done
  post-publish-host-acceptance:
    needs: [acceptance-config, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    environment: release-sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.acceptance-config.outputs.commit }}
          fetch-depth: 1
      - name: Confirm the published tag still names the validated object
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_TAG_OBJECT: ${{ needs.acceptance-config.outputs.tag_object }}
          SELECTED_BASELINE: ${{ matrix.arch == 'arm64' && inputs.arm64_bootstrap_from_tag != '' && inputs.arm64_bootstrap_from_tag || inputs.upgrade_from_tag }}
          VALIDATED_BASELINE_OBJECT: ${{ matrix.arch == 'arm64' && inputs.arm64_bootstrap_from_tag != '' && needs.acceptance-config.outputs.arm64_baseline_tag_object || needs.acceptance-config.outputs.baseline_tag_object }}
        run: |
          set -euo pipefail
          remote_tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
          [[ "$remote_tag_object" == "$VALIDATED_TAG_OBJECT" ]] || { echo 'release tag moved after publication'; exit 1; }
          if [[ -n "$SELECTED_BASELINE" ]]; then
            remote_baseline="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SELECTED_BASELINE" --jq .object.sha)"
            [[ "$remote_baseline" == "$VALIDATED_BASELINE_OBJECT" ]] || { echo 'baseline tag moved before host acceptance'; exit 1; }
          fi
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Install published release on a clean host and exercise upgrade/rollback
        env:
          TARGET_TAG: ${{ inputs.tag }}
          UPGRADE_FROM_TAG: ${{ matrix.arch == 'arm64' && inputs.arm64_bootstrap_from_tag != '' && inputs.arm64_bootstrap_from_tag || inputs.upgrade_from_tag }}
          BASELINE_KIND: ${{ matrix.arch == 'arm64' && inputs.arm64_bootstrap_from_tag != '' && 'rc-promotion' || 'stable-upgrade' }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_COMMIT: ${{ needs.acceptance-config.outputs.commit }}
          EXPECTED_BASELINE_COMMIT: ${{ matrix.arch == 'arm64' && inputs.arm64_bootstrap_from_tag != '' && needs.acceptance-config.outputs.arm64_baseline_commit || needs.acceptance-config.outputs.baseline_commit }}
        run: |
          set -euo pipefail
          case "$(uname -m):$EXPECTED_ARCH" in
            x86_64:amd64|aarch64:arm64) ;;
            *) echo 'native acceptance runner architecture mismatch'; exit 1 ;;
          esac
          sudo -E ./scripts/release/post-publish-acceptance.sh

  promote-final:
    needs: post-publish-host-acceptance
    if: inputs.profile == 'final'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Promote accepted final release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest=true

  verify-final-discovery:
    needs: [acceptance-config, promote-final]
    if: inputs.profile == 'final'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.acceptance-config.outputs.commit }}
          fetch-depth: 1
      - name: Verify stable latest discovery after promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/release/crewqual-release-publish
          verify_final_discovery "$RELEASE_TAG"
          directory="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$directory" \
            --pattern update-manifest-v1.json --pattern update-manifest-v1.json.sig
          node - "$directory" "$RELEASE_TAG" <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const [directory, tag] = process.argv.slice(2);
          const raw = fs.readFileSync(`${directory}/update-manifest-v1.json`);
          const manifest = JSON.parse(raw);
          const keyring = JSON.parse(fs.readFileSync('security/update-manifest-keyring.json'));
          const keys = keyring.keys.filter(key => key.id === manifest.signingKeyId && ['active', 'next'].includes(key.status));
          if (keys.length !== 1 || manifest.version !== tag || manifest.channel !== 'stable') throw new Error('stable discovery manifest identity mismatch');
          const key = crypto.createPublicKey({key: Buffer.concat([Buffer.from('302a300506032b6570032100', 'hex'), Buffer.from(keys[0].publicKey, 'base64')]), format: 'der', type: 'spki'});
          const signature = Buffer.from(fs.readFileSync(`${directory}/update-manifest-v1.json.sig`).toString().trim(), 'base64');
          if (!crypto.verify(null, raw, key, signature)) throw new Error('invalid stable discovery manifest signature');
          NODE
          # Exercise production unpinned discovery against /releases, including
          # its selection ordering and signature verification using built-in keys.
          (cd updater && go build -trimpath -o "$directory/crewqual-updater" .)
          jq -n --arg root "$directory" --arg api "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
            '{installDir:$root,dataDir:($root+"/state"),composeFile:($root+"/compose.yaml"),envFile:($root+"/.env"),sharedSecret:"disposable-discovery",channel:"stable",releaseAPIURL:$api,manifestURL:""}' > "$directory/config.json"
          jq -e '.channel == "stable" and .manifestURL == ""' "$directory/config.json" >/dev/null
          CREWQUAL_UPDATER_CONFIG="$directory/config.json" "$directory/crewqual-updater" check
          CREWQUAL_UPDATER_CONFIG="$directory/config.json" "$directory/crewqual-updater" status > "$directory/status.json"
          jq -e --arg tag "$RELEASE_TAG" '.latestVersion == $tag and (.releasePublishedAt | length > 0)' "$directory/status.json" >/dev/null
          rm -rf -- "$directory"

  keep-rc-prerelease:
    needs: post-publish-host-acceptance
    if: inputs.profile == 'rc'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Keep accepted RC prerelease off latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease=true --latest=false
