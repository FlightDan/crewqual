name: release-acceptance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed release tag (for example v1.0.0-rc.1 or v1.0.0)
        required: true
        type: string
      profile:
        description: rc or final
        required: true
        default: rc
        type: choice
        options: [rc, final]
permissions:
  contents: read
  id-token: write

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: release-sandbox
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_PROFILE: ${{ inputs.profile }}
      RELEASE_RUN_ID: ${{ github.run_id }}
      RELEASE_BASE_URL: ${{ secrets.RELEASE_BASE_URL }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ADMIN_TOTP_SECRET: ${{ secrets.E2E_ADMIN_TOTP_SECRET }}
      RELEASE_WEB_IMAGE: ${{ secrets.RELEASE_WEB_IMAGE }}
      RELEASE_RUNTIME_IMAGE: ${{ secrets.RELEASE_RUNTIME_IMAGE }}
      UPDATE_MANIFEST_PRIVATE_KEY_B64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_B64 }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      EVIDENCE_S3_BUCKET: ${{ secrets.EVIDENCE_S3_BUCKET }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      RESTORE_S3_BUCKET: ${{ secrets.RESTORE_S3_BUCKET }}
      S3_KMS_KEY_ARN: ${{ secrets.S3_KMS_KEY_ARN }}
      S3_FORBIDDEN_PREFIX: ${{ secrets.S3_FORBIDDEN_PREFIX }}
      BACKUP_RECOVERY_SET_ID: ${{ secrets.BACKUP_RECOVERY_SET_ID }}
      BACKUP_DATABASE_RUN_ID: ${{ secrets.BACKUP_DATABASE_RUN_ID }}
      BACKUP_GALLERY_RUN_ID: ${{ secrets.BACKUP_GALLERY_RUN_ID }}
      BACKUP_TAMPER_ARTIFACT_KEYS: ${{ secrets.BACKUP_TAMPER_ARTIFACT_KEYS }}
      BACKUP_TAMPER_BLOB_SHA256: ${{ secrets.BACKUP_TAMPER_BLOB_SHA256 }}
      RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RELEASE_SIGNER_FINGERPRINTS: ${{ secrets.RELEASE_SIGNER_FINGERPRINTS }}
      COSIGN_CERT_IDENTITY_REGEXP: ${{ secrets.COSIGN_CERT_IDENTITY_REGEXP }}
      COSIGN_OIDC_ISSUER: ${{ secrets.COSIGN_OIDC_ISSUER }}
      LICENSE_APPROVALS_FILE: /tmp/license-approvals.json
      RELEASE_EVIDENCE_SIGNATURE: /tmp/evidence.sig
      SMS_ADAPTER: disabled
      FEISHU_ADAPTER: disabled
      VLM_ADAPTER: disabled
    steps:
      - name: Checkout signed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Install release verification tools
        run: sudo ./scripts/release/install-tools.sh
      - name: Build and sign updater manifest
        if: inputs.profile == 'final'
        run: |
          set -euo pipefail
          updater_dir="$RUNNER_TEMP/crewqual-updater"
          ./updater/build-release.sh "$updater_dir"
          export UPDATER_AMD64_SHA256="$(awk '{print $1}' "$updater_dir/crewqual-updater-linux-amd64.sha256")"
          export UPDATER_ARM64_SHA256="$(awk '{print $1}' "$updater_dir/crewqual-updater-linux-arm64.sha256")"
          export UPDATE_MANIFEST_OUTPUT="$RUNNER_TEMP/update-manifest-v1.json"
          pnpm release:update-manifest
          pnpm release:sign-update-manifest "$UPDATE_MANIFEST_OUTPUT" "$UPDATE_MANIFEST_OUTPUT.sig"
          test "$(wc -c <"$UPDATE_MANIFEST_OUTPUT.sig")" -ge 80
      - name: Upload signed updater manifest evidence
        if: inputs.profile == 'final'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-updater-manifest-${{ inputs.tag }}
          path: |
            ${{ runner.temp }}/update-manifest-v1.json
            ${{ runner.temp }}/update-manifest-v1.json.sig
          if-no-files-found: error
      - name: Prepare signed evidence inputs
        env:
          LICENSE_APPROVALS_JSON: ${{ secrets.LICENSE_APPROVALS_JSON }}
          RELEASE_EVIDENCE_SIGNATURE_B64: ${{ secrets.RELEASE_EVIDENCE_SIGNATURE_B64 }}
        run: |
          printf '%s' "$LICENSE_APPROVALS_JSON" > "$LICENSE_APPROVALS_FILE"
          printf '%s' "$RELEASE_EVIDENCE_SIGNATURE_B64" | base64 --decode > "$RELEASE_EVIDENCE_SIGNATURE"
          pnpm release:manifest .artifacts/migration-checksums.json
          echo "MIGRATION_CHECKSUM_MANIFEST=$GITHUB_WORKSPACE/.artifacts/migration-checksums.json" >> "$GITHUB_ENV"
      - name: Run release acceptance gates
        env:
          RELEASE_DEFER_ARTIFACT: "1"
        run: pnpm release:verify -- --tag "$RELEASE_TAG" --profile "$RELEASE_PROFILE"
      - name: Sign release evidence
        if: env.RELEASE_PROFILE == 'final'
        run: |
          cosign sign-blob --yes \
            --output-signature "$RELEASE_EVIDENCE_SIGNATURE" \
            --output-certificate /tmp/evidence.pem \
            ".artifacts/release/$RELEASE_RUN_ID/evidence.json"
      - name: Verify signed release evidence
        if: env.RELEASE_PROFILE == 'final'
        run: pnpm release:verify:artifact -- --tag "$RELEASE_TAG" --profile "$RELEASE_PROFILE"
