services:
  postgres:
    image: postgres@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
    environment:
      POSTGRES_DB: crewqual
      POSTGRES_USER: crewqual
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crewqual -d crewqual"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${ACCEPTANCE_DB_PORT:-55432}:5432"
    networks: [internal]

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    volumes:
      - minio-data:/data
    networks: [internal]

  minio-init:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        do sleep 1; done;
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
    depends_on:
      minio: { condition: service_started }
    restart: "no"
    networks: [internal]

  migrate:
    image: ${RELEASE_RUNTIME_IMAGE:?RELEASE_RUNTIME_IMAGE is required}
    command: ["node", "scripts/container-entrypoint.mjs", "migrate"]
    environment: &app-env
      NODE_ENV: production
      SERVICE_MODE: remote
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      TLS_EMAIL: ${TLS_EMAIL:-crewqual-local@lan.invalid}
      DEPLOYMENT_NETWORK_MODE: ${DEPLOYMENT_NETWORK_MODE:-tls}
      APP_PORT: ${APP_PORT:-443}
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-localhost}
      APP_BIND: ${APP_BIND:-0.0.0.0}
      ACME_BIND: ${ACME_BIND:-127.0.0.1}
      ACME_PORT: ${ACME_PORT:-18080}
      NETWORK_ACCESS_SECRET: ${NETWORK_ACCESS_SECRET:-local-network-access-secret-change-me}
      SETUP_AUTH_CODE_HASH: ${SETUP_AUTH_CODE_HASH:-}
      DATABASE_URL: postgresql://crewqual:${POSTGRES_PASSWORD}@postgres:5432/crewqual
      DIRECT_URL: postgresql://crewqual:${POSTGRES_PASSWORD}@postgres:5432/crewqual
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY is required}
      STORAGE_MODE: ${STORAGE_MODE:-external}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_SSE_KMS_KEY_ID: ${S3_SSE_KMS_KEY_ID:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      SMS_ADAPTER: disabled
      FEISHU_ADAPTER: disabled
      VLM_ADAPTER: disabled
      CREWQUAL_ACCEPTANCE_EXTERNALS_DISABLED: "1"
      ACCEPTANCE_ENVIRONMENT_ID: "1"
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    networks: [internal]

  ops:
    image: ${RELEASE_RUNTIME_IMAGE:?RELEASE_RUNTIME_IMAGE is required}
    profiles: [ops]
    command: ["node", "scripts/container-entrypoint.mjs", "db-check"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  bootstrap:
    image: ${RELEASE_RUNTIME_IMAGE:?RELEASE_RUNTIME_IMAGE is required}
    command: ["node", "scripts/container-entrypoint.mjs", "bootstrap"]
    environment:
      <<: *app-env
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?INITIAL_ADMIN_EMAIL is required}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD is required}
      INITIAL_ADMIN_TOTP_SECRET: ${INITIAL_ADMIN_TOTP_SECRET:?INITIAL_ADMIN_TOTP_SECRET is required}
      INITIAL_ORGANIZATION_CODE: ${INITIAL_ORGANIZATION_CODE:-CREWQUAL}
      INITIAL_ORGANIZATION_NAME: ${INITIAL_ORGANIZATION_NAME:-CrewQual}
      INITIAL_UNIT_CODE: ${INITIAL_UNIT_CODE:-ROOT}
      INITIAL_UNIT_NAME: ${INITIAL_UNIT_NAME:-运行单位}
      INITIAL_TEMPLATE_PACK_CODE: ${INITIAL_TEMPLATE_PACK_CODE:-aviation-china-airline-pilot}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]

  web:
    image: ${RELEASE_WEB_IMAGE:?RELEASE_WEB_IMAGE is required}
    environment: *app-env
    ports:
      - "127.0.0.1:${ACCEPTANCE_WEB_PORT:-3010}:3000"
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    networks: [internal]

  worker:
    image: ${RELEASE_RUNTIME_IMAGE:?RELEASE_RUNTIME_IMAGE is required}
    environment: *app-env
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "scripts/worker-health.mjs"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - backup-data:/backups
    networks: [internal]

volumes:
  postgres-data:
  minio-data:
  backup-data:

networks:
  internal:
